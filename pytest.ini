[pytest]
testpaths = tests
addopts = -m "not behavioral"
markers =
    slow: long-running tests (e.g. tests that need a trained model or the dataset); skip with -m "not slow"
    behavioral: CheckList behavioral tests (MFT, INV, DIR) on the real fine-tuned model (downloaded from Hugging Face, ~1.2 GB, on first run); skipped by default (addopts), run with -m behavioral
